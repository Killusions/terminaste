[workspace]
resolver = "2"
members = [
  "crates/terminaste-app",
  "crates/terminaste-completion",
  "crates/terminaste-core",
  "crates/terminaste-integration-tests",
  "crates/terminaste-pty",
  "crates/terminaste-settings",
  "crates/terminaste-tools",
  "crates/terminaste-ui",
]
default-members = ["crates/terminaste-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["terminaste contributors"]
repository = "https://github.com/Killusions/terminaste"
homepage = "https://github.com/Killusions/terminaste"
readme = "README.md"
keywords = ["terminal", "shell", "zsh", "macos"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
crossbeam-channel = "0.5.15"
directories = "6.0.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba7da93e5ccc2b630077b2ae26c7581f3c21f984" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba7da93e5ccc2b630077b2ae26c7581f3c21f984", features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
portable-pty = "0.8.1"
resvg = "0.45.1"
schemars = { version = "0.8.22", features = ["preserve_order"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
toml = "0.8.22"
unicode-width = "0.2.0"
uuid = { version = "1.17.0", features = ["v4", "serde"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.terminaste-core]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.ship]
inherits = "release"
strip = "symbols"

[profile.fast]
inherits = "dev"
opt-level = 1

[profile.tiny]
inherits = "release"
opt-level = "z"
lto = true
