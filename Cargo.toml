[workspace]
resolver = "2"
members = [
  "crates/terminaste-app",
  "crates/terminaste-completion",
  "crates/terminaste-core",
  "crates/terminaste-integration-tests",
  "crates/terminaste-pty",
  "crates/terminaste-settings",
  "crates/terminaste-tools",
  "crates/terminaste-ui",
]
default-members = ["crates/terminaste-app"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["terminaste contributors"]
repository = "https://github.com/Killusions/terminaste"
homepage = "https://github.com/Killusions/terminaste"
readme = "README.md"
keywords = ["terminal", "shell", "zsh", "macos"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "610ea4b8de1c6e887f03563f067278002f41256e" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "610ea4b8de1c6e887f03563f067278002f41256e", features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
portable-pty = "0.9.0"
schemars = { version = "1.2.3", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
unicode-width = "0.2.3"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
yaml_serde = "0.10.7"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.terminaste-core]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.ship]
inherits = "release"
strip = "symbols"

[profile.fast]
inherits = "dev"
opt-level = 1

[profile.tiny]
inherits = "release"
opt-level = "z"
lto = true
