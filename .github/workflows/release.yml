name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/check.sh
      - run: tools/release/macos
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/terminaste-macos-arm64.tar.gz
            dist/terminaste-macos-arm64.tar.gz.sha256
          generate_release_notes: true

  crates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: tools/release/publish-crates --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
