name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo --version
      - run: tools/check.sh
      - run: tools/release/macos
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/terminaste-macos-arm64.tar.gz
            dist/terminaste-macos-arm64.tar.gz.sha256
          generate_release_notes: true

  crates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo --version
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: tools/release/publish-crates --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
